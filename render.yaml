services:
  - type: web
    name: clipkeep-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CLIPKEEP_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://clipkeep-th-8m4q.exact-jam-3580.chatgpt.site
      - key: PUBLIC_SITE_ORIGIN
        value: https://klipnivo.onrender.com
  - type: web
    name: klipnivo
    runtime: static
    buildCommand: "true"
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
